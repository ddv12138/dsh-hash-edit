name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate package (ESM)
        run: node --input-type=module -e "const p=await import('./package.json', { with: { type: 'json' } }); const e=await import('./src/engine.js'); if(!e.xxh32||!e.computeReplace) process.exit(1); console.log('package/engine load OK, version', p.default.version)"

  coverage:
    name: Coverage gate (>= 85% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Run coverage gate
        run: npm run test:coverage:threshold
